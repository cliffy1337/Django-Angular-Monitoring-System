# Local demo stack.  One command to run everything:
#
#   cp .env.example .env
#   docker compose up --build
#
# Uses PostgreSQL (not SQLite) and prints emails to the log (no SMTP needed).
# For production, use docker-compose.prod.yml instead.

services:

  db:
    image: postgres:15
    command: postgres -c timezone=Africa/Lusaka
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-vigil_db}
      POSTGRES_USER:     ${POSTGRES_USER:-vigil_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigil_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigil_user} -d ${POSTGRES_DB:-vigil_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command: redis-server --maxclients 3000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # Dockerfile CMD starts gunicorn; entrypoint.sh runs migrate first.
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.docker
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build: ./backend
    command: celery -A config worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.docker
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy

  beat:
    build: ./backend
    command: celery -A config beat -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.docker
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
